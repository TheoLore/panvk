name: Build kbase Android ICD

# Builds libvulkan_panfrost.so from the in-repo android-kbase/ tree only.
# Does not clone third-party layer repos at build time.
# Maintainer: TheoLore · driverInfo: PanLore

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Patch profile (g615-v11-csf = universal ICD with jm-v7 + jm-v9)
        required: true
        default: g615-v11-csf
      release_name:
        description: String reported in driverInfo (PANVK_KBASE_RELEASE)
        required: true
        default: PanLore

permissions:
  contents: read

concurrency:
  group: build-kbase-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DEBIAN_FRONTEND: noninteractive
      PANVK_KBASE_RELEASE: ${{ inputs.release_name }}
      ANDROID_API: "29"
    steps:
      - name: Checkout (with android-kbase)
        uses: actions/checkout@v4

      - name: Require vendored layer
        run: |
          set -euo pipefail
          test -d android-kbase
          test -f android-kbase/sources.lock
          test -d android-kbase/patches/kbase-common
          test -d android-kbase/patches/jm-v7
          test -x android-kbase/scripts/fetch-mesa.sh || chmod +x android-kbase/scripts/*.sh
          find android-kbase/scripts -name '*.sh' -exec chmod +x {} +
          echo "Using in-repo android-kbase only"
          head -n 20 android-kbase/VENDOR.md || true

      - name: Install host packages
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential git python3 python3-pip python3-setuptools python3-mako \
            ninja-build pkg-config bison flex \
            llvm-dev clang libclang-dev \
            libllvmspirvlib-18-dev \
            libdrm-dev libexpat1-dev \
            libxml2-dev libzstd-dev zlib1g-dev \
            libxcb1-dev libx11-dev libxext-dev libxdamage-dev libx11-xcb-dev \
            libxcb-glx0-dev libxcb-shm0-dev libxcb-dri2-0-dev libxcb-dri3-dev \
            libxcb-present-dev libxcb-sync-dev libxshmfence-dev libxxf86vm-dev \
            glslang-tools \
            cmake curl unzip ca-certificates zip rsync
          pip3 install --user --break-system-packages 'meson>=1.3' || pip3 install --user 'meson>=1.3'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          meson --version

      - name: Install Android NDK
        run: |
          set -euo pipefail
          NDK_ZIP=android-ndk-r27c-linux.zip
          curl -fsSL -o /tmp/ndk.zip \
            "https://dl.google.com/android/repository/${NDK_ZIP}"
          sudo mkdir -p /opt/android-ndk
          sudo unzip -q /tmp/ndk.zip -d /opt/android-ndk
          NDK_ROOT=$(echo /opt/android-ndk/android-ndk-*)
          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"

      - name: Fetch pinned Mesa (into android-kbase/work)
        working-directory: android-kbase
        run: |
          set -euo pipefail
          ./scripts/fetch-mesa.sh
          echo "MESA_HEAD=$(git -C work/mesa rev-parse HEAD)"
          echo "MESA_VERSION=$(cat work/mesa/VERSION)"

      - name: Apply patch series
        working-directory: android-kbase
        run: |
          set -euo pipefail
          ./scripts/apply-patches.sh --profile "${{ inputs.profile }}"

      - name: Build Android ICD
        working-directory: android-kbase
        run: |
          set -euo pipefail
          export ANDROID_NDK_ROOT
          export PANVK_KBASE_RELEASE
          export PANVK_JOBS="$(nproc)"
          export PATH="$HOME/.local/bin:$PATH"
          ./scripts/build-android.sh --profile "${{ inputs.profile }}" --api "$ANDROID_API" --ndk "$ANDROID_NDK_ROOT"
          SO="dist/android-${{ inputs.profile }}/libvulkan_panfrost.so"
          test -f "$SO"
          file "$SO"
          sha256sum "$SO"

      - name: Package ICD + launcher meta
        working-directory: android-kbase
        run: |
          set -euo pipefail
          OUT=../artifact
          mkdir -p "$OUT"
          SO="dist/android-${{ inputs.profile }}/libvulkan_panfrost.so"
          cp "$SO" "$OUT/libvulkan_panfrost.so"
          MESA_SHA=$(git -C work/mesa rev-parse HEAD)
          MESA_VER=$(cat work/mesa/VERSION)
          SO_SHA=$(sha256sum "$SO" | awk '{print $1}')
          REL="${{ inputs.release_name }}"
          PROFILE="${{ inputs.profile }}"
          LAYER_NOTE=$(test -f VENDOR.md && head -5 VENDOR.md | tr '\n' ' ' || echo local)
          python3 - <<PY
          import json, pathlib, zipfile
          out = pathlib.Path("../artifact")
          mesa_sha, mesa_ver, so_sha = "${MESA_SHA}", "${MESA_VER}", "${SO_SHA}"
          rel, profile = "${REL}", "${PROFILE}"
          (out / "panfrost_icd.aarch64.json").write_text(json.dumps({
              "file_format_version": "1.0.0",
              "ICD": {"library_path": "libvulkan_panfrost.so", "api_version": "1.3"},
          }, indent=2) + "\n")
          meta = {
              "schemaVersion": 1,
              "name": rel,
              "description": f"{rel}: Mesa PanVK via mali_kbase (profile {profile}). Local android-kbase tree.",
              "author": "TheoLore",
              "packageVersion": "0.0.0-ci",
              "vendor": "Mesa",
              "driverVersion": f"{rel} (Mesa {mesa_ver} git-{mesa_sha[:10]})",
              "minApi": 29,
              "libraryName": "libvulkan_panfrost.so",
          }
          (out / "meta.json").write_text(json.dumps(meta, indent=2) + "\n")
          (out / "SHA256SUMS.txt").write_text(f"{so_sha}  libvulkan_panfrost.so\n")
          (out / "BUILD.txt").write_text(
              f"profile={profile}\ndriverInfo_release={rel}\nmesa={mesa_sha}\n"
              f"mesa_version={mesa_ver}\nso_sha256={so_sha}\nandroid_api=29\n"
              f"kmds=kbase\nsource=android-kbase (in-repo)\n"
          )
          zpath = out / f"{rel}-android-adrenotools.zip"
          with zipfile.ZipFile(zpath, "w", zipfile.ZIP_DEFLATED) as z:
              for name in ("libvulkan_panfrost.so", "meta.json",
                           "panfrost_icd.aarch64.json", "SHA256SUMS.txt", "BUILD.txt"):
                  z.write(out / name, name)
          print("OK", zpath)
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: panlore-kbase-${{ inputs.profile }}
          path: artifact/
          if-no-files-found: error
          retention-days: 30
